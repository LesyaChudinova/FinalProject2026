<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Регистрация</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <h1>Регистрация</h1>
            <form action="/register" method="post">
                <div class="form-group">
                    <label>Почта</label>
                    <input type="email" name="email" placeholder="example@mail.ru" required>
                </div>
                <div class="form-group">
                    <label>Пароль</label>
                    <input type="password" name="password" placeholder="Минимум 8 символов" required>
                </div>
                <div class="form-group">
                    <label>Имя</label>
                    <input type="text" name="nickname" placeholder="Ваше имя" required>
                </div>
                <div class="form-group">
                    <label>Возраст</label>
                    <input type="number" name="age" placeholder="25" min="10" max="90">
                </div>
                <button type="submit" class="btn">Зарегистрироваться</button>
            </form>
            <div class="link">
                <a href="/">Уже есть аккаунт? Войти</a>
            </div>
        </div>
    </div>
</body>
</html>
